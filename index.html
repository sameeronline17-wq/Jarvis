<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JARVIS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #082a3b 0, #031018 25%, #010508 65%);
      color: #dffcff; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; justify-content: center;
    }
    .app { width: min(900px,100%); height: 100vh; padding: 24px 18px; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size: 14px; letter-spacing: .45em; color:#8deeff; }
    .status { font-size:12px; color:#79ffd9; letter-spacing:.12em; }
    main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; }
    .orb {
      width: 190px; height:190px; border-radius:50%;
      border:1px solid rgba(91,225,255,.7);
      box-shadow: 0 0 25px #12cfff, inset 0 0 35px rgba(31,205,255,.55);
      background: radial-gradient(circle at 45% 42%, #b9fbff 0 2%, #27cfff 10%, #08779b 35%, #021923 67%);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform:scale(1.035); box-shadow:0 0 55px #12cfff, inset 0 0 45px rgba(31,205,255,.8); } }
    .title { font-size: 32px; letter-spacing:.3em; margin-left:.3em; }
    .chat { width:100%; max-width:720px; display:flex; gap:10px; }
    input {
      flex:1; border:1px solid rgba(86,218,255,.35); border-radius:14px;
      background:rgba(0,12,18,.75); color:white; padding:15px 16px; outline:none;
    }
    button {
      border:1px solid rgba(86,218,255,.55); border-radius:14px; padding:0 18px;
      background:rgba(5,54,70,.65); color:#bdf7ff; font-weight:600;
    }
    #reply { width:100%; max-width:720px; min-height:24px; text-align:center; color:#b9edf5; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">JARVIS</div>
      <div class="status">● ONLINE</div>
    </header>
    <main>
      <div class="orb" aria-label="JARVIS Orb"></div>
      <div class="title">JARVIS</div>
      <div id="reply">Bereit, Chef.</div>
      <form class="chat" id="chat">
        <input id="message" autocomplete="off" placeholder="Sprich mit JARVIS …">
        <button>Senden</button>
      </form>
    </main>
  </div>
  <script>
    const form = document.querySelector("#chat");
    const input = document.querySelector("#message");
    const reply = document.querySelector("#reply");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      reply.textContent = "JARVIS denkt …";
      input.value = "";
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({message})
        });
        const data = await r.json();
        reply.textContent = data.reply || data.error || "Keine Antwort.";
      } catch {
        reply.textContent = "Backend nicht erreichbar.";
      }
    });
  </script>
</body>
</html>
